[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "staffing"
version = "1.0.0"
description = "Dynamic agent staffing for Google Ads onboarding: simulator, staffing policies and demand forecasters."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Vedaant Agarwal" },
    { name = "Atharv Raturi" },
    { name = "Monika Voutov" },
    { name = "Konstantin Zhivotov" },
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "nbformat>=5", "nbclient>=0.8", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
